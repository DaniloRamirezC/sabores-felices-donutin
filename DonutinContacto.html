<!DOCTYPE html>
<html lang="es-CL">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="estilo.css">
        <title>Sabores Felices Donutin</title>
    </head>
    <body>
        <div class="container text-center">
            <img id="img-catalogo" src="DonutinLogo2.png" alt="Donutin">
        </div>
        <nav class="nav-catalogo">
            <ul>
                <li>
                    <a href="DonutinPrueba.html">Inicio</a>
                    <a href="DonutinCatalogo.html">Catálogo</a>
                    <a href="DonutinContacto.html">Contacto</a>
                </li>
            </ul>
        </nav>
        <div id="contenedor-formulario" class="container">
            <form id="form-donutin">
                <fieldset>
                    <legend style="text-align: center; color: hotpink;">Contacto</legend>

                    <label for="campo_run">RUT</label>
                    <input type="text" name="campo_run" id="campo_run" placeholder="12345678-9">
                    <span class="error" id="mensaje_campo_run"></span>

                    <label for="campo_nombre">Nombre</label>
                    <input type="text" name="campo_nombre" id="campo_nombre" placeholder="Juan Pérez">
                    <span class="error" id="mensaje_campo_nombre"></span>

                    <label for="campo_telefono">Teléfono de contacto</label>
                    <input type="text" name="campo_telefono" id="campo_telefono" placeholder="56912345678">
                    <span class="error" id="mensaje_campo_telefono"></span>

                    <label for="campo_correo">Correo electrónico</label>
                    <input type="text" name="campo_correo" id="campo_correo" placeholder="correo@example.com">
                    <span class="error" id="mensaje_campo_correo"></span>

                    <label for="campo_mensaje">Mensaje</label>
                    <input type="text" name="campo_mensaje" id="campo_mensaje" placeholder="Escriba su mensaje">
                    <span class="error" id="mensaje_campo_mensaje"></span>

                    <div class="btn-form">
                        <button type="reset">Limpiar</button>
                        <button type="button">Enviar</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </body>
</html>
